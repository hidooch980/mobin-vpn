name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Unit tests (including the live subscription)
        run: |
          curl -fsSL https://raw.githubusercontent.com/hidooch980/vpn-sub/sub/sub.txt -o sub.txt || true
          SUB_FILE=$PWD/sub.txt flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Release keystore (optional secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Bundle free routes (Psiphon library, Tor and lyrebird binaries from MSN-GUARD)
        run: |
          set -e
          SRC=https://raw.githubusercontent.com/mbm110/MSN-GUARD/master
          mkdir -p android/app/libs android/app/src/main/assets
          curl -fL --retry 3 -o android/app/libs/psiphontunnel.aar "https://github.com/mbm110/MSN-GUARD/raw/master/app/libs/psiphontunnel-2.0.39.aar"
          curl -fL --retry 3 -o android/app/src/main/assets/server_entries.txt "$SRC/app/src/main/assets/server_entries.txt" || echo "no embedded Psiphon server list"
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "android/app/src/main/jniLibs/$abi"
            for lib in libtor.so libobfs4proxy.so; do
              curl -fL --retry 3 -o "android/app/src/main/jniLibs/$abi/$lib" "https://github.com/mbm110/MSN-GUARD/raw/master/app/src/main/jniLibs/$abi/$lib"
            done
          done
          ls -la android/app/libs android/app/src/main/jniLibs/*
      - name: Build APKs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-name "$VERSION" --build-number "${{ github.run_number }}"
          flutter build apk --release --split-per-abi --build-name "$VERSION" --build-number "${{ github.run_number }}"
          mkdir dist
          cd build/app/outputs/flutter-apk
          cp app-release.apk             ../../../../dist/MobinVPN-android-universal.apk
          cp app-arm64-v8a-release.apk   ../../../../dist/MobinVPN-android-arm64.apk
          cp app-armeabi-v7a-release.apk ../../../../dist/MobinVPN-android-armv7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build windows --release --build-name $env:VERSION --build-number ${{ github.run_number }}
      - name: Bundle sing-box (latest 1.12.x)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R SagerNet/sing-box --exclude-pre-releases --limit 100 --json tagName \
                --jq '[.[].tagName | select(startswith("v1.12."))][0]')
          VER=${TAG#v}
          gh release download "$TAG" -R SagerNet/sing-box -p "sing-box-${VER}-windows-amd64.zip" -O sb.zip
          unzip -q sb.zip
          cp "sing-box-${VER}-windows-amd64/sing-box.exe" build/windows/x64/runner/Release/
      - name: Validate the config shapes the app generates (TUN, fragment, DNS)
        shell: bash
        run: |
          cat > app-config-test.json <<'JSON'
          {
            "log": {"level": "warn"},
            "dns": {"servers": [{"type": "local", "tag": "local"},
                                {"type": "https", "tag": "remote", "server": "1.1.1.1", "detour": "proxy"}],
                    "final": "remote", "strategy": "prefer_ipv4"},
            "inbounds": [
              {"type": "mixed", "tag": "in", "listen": "127.0.0.1", "listen_port": 10808},
              {"type": "tun", "tag": "tun", "interface_name": "MobinVPN",
               "address": ["172.19.0.1/30", "fdfe:dcba:9876::1/126"], "auto_route": true, "strict_route": true, "stack": "mixed"}
            ],
            "outbounds": [
              {"type": "vless", "tag": "proxy", "server": "example.com", "server_port": 443,
               "uuid": "11111111-1111-1111-1111-111111111111", "packet_encoding": "xudp",
               "tls": {"enabled": true, "server_name": "example.com", "record_fragment": true,
                       "utls": {"enabled": true, "fingerprint": "chrome"}},
               "transport": {"type": "ws", "path": "/"}},
              {"type": "direct", "tag": "direct"}
            ],
            "route": {"rules": [{"action": "sniff"}, {"protocol": "dns", "action": "hijack-dns"},
                                {"ip_is_private": true, "outbound": "direct"},
                                {"domain_suffix": ["ir"], "outbound": "direct"}],
                      "final": "proxy", "auto_detect_interface": true, "default_domain_resolver": "local"},
            "experimental": {"clash_api": {"external_controller": "127.0.0.1:9090"}}
          }
          JSON
          build/windows/x64/runner/Release/sing-box.exe check -c app-config-test.json
      - name: Zip
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/MobinVPN-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MolidoVPN ${{ env.VERSION }}
          make_latest: true
          files: dist/*
          body: |
            ## دانلود
            | دستگاه | فایل |
            |---|---|
            | اندروید (بیشتر گوشی‌ها) | `MobinVPN-android-arm64.apk` |
            | اندروید قدیمی | `MobinVPN-android-armv7.apk` |
            | اگر مطمئن نیستید | `MobinVPN-android-universal.apk` |
            | ویندوز ۱۰ و ۱۱ | `MobinVPN-windows-x64.zip` ← از حالت فشرده خارج کنید و `mobin_vpn.exe` (MolidoVPN) را اجرا کنید |

            ## استفاده
            - دکمه‌ی بزرگ را بزنید. در حالت **هوشمند** برنامه سرورها را با اینترنت خودتان می‌سنجد و به سریع‌ترین وصل می‌شود.
            - کارت «موقعیت» برای انتخاب کشور، دکمه‌ی 🖧 برای همه‌ی سرورها و تست پینگ، دکمه‌ی ⚙ برای تنظیمات پیشرفته.
            - برنامه خودش نسخه‌ی جدید را پیدا و نصب می‌کند.
