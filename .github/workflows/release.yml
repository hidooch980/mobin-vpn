name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Unit tests (including the live subscription)
        run: |
          curl -fsSL https://raw.githubusercontent.com/hidooch980/vpn-sub/sub/sub.txt -o sub.txt || true
          SUB_FILE=$PWD/sub.txt flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Release keystore (optional secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --build-name "$VERSION" --build-number "${{ github.run_number }}"
          flutter build apk --release --split-per-abi --build-name "$VERSION" --build-number "${{ github.run_number }}"
          mkdir dist
          cd build/app/outputs/flutter-apk
          cp app-release.apk             ../../../../dist/MobinVPN-android-universal.apk
          cp app-arm64-v8a-release.apk   ../../../../dist/MobinVPN-android-arm64.apk
          cp app-armeabi-v7a-release.apk ../../../../dist/MobinVPN-android-armv7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release --build-name $env:VERSION --build-number ${{ github.run_number }}
      - name: Bundle sing-box (latest 1.11.x)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R SagerNet/sing-box --exclude-pre-releases --limit 100 --json tagName \
                --jq '[.[].tagName | select(startswith("v1.11."))][0]')
          VER=${TAG#v}
          gh release download "$TAG" -R SagerNet/sing-box -p "sing-box-${VER}-windows-amd64.zip" -O sb.zip
          unzip -q sb.zip
          cp "sing-box-${VER}-windows-amd64/sing-box.exe" build/windows/x64/runner/Release/
      - name: Zip
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/MobinVPN-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Mobin VPN ${{ env.VERSION }}
          make_latest: true
          files: dist/*
          body: |
            ## دانلود
            | دستگاه | فایل |
            |---|---|
            | اندروید (بیشتر گوشی‌ها) | `MobinVPN-android-arm64.apk` |
            | اندروید قدیمی | `MobinVPN-android-armv7.apk` |
            | اگر مطمئن نیستید | `MobinVPN-android-universal.apk` |
            | ویندوز ۱۰ و ۱۱ | `MobinVPN-windows-x64.zip` ← از حالت فشرده خارج کنید و `mobin_vpn.exe` را اجرا کنید |

            ## استفاده
            - دکمه‌ی بزرگ را بزنید. در حالت **هوشمند** برنامه سرورها را با اینترنت خودتان می‌سنجد و به سریع‌ترین وصل می‌شود.
            - **گیمینگ 🎮**: سرورهای نزدیک به ایران با کمترین و پایدارترین پینگ.
            - کارت «موقعیت» برای انتخاب کشور، دکمه‌ی 🖧 برای همه‌ی سرورها و تست پینگ، دکمه‌ی ⚙ برای تنظیمات پیشرفته.
            - برنامه خودش نسخه‌ی جدید را پیدا و نصب می‌کند.
