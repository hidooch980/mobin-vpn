name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 2.0.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Unit tests (including the live subscription)
        run: |
          curl -fsSL https://raw.githubusercontent.com/hidooch980/vpn-sub/sub/sub.txt -o sub.txt || true
          SUB_FILE=$PWD/sub.txt flutter test

  android:
    # Android app = MolidoVPN Android (MSN-GUARD based, AGPL-3.0) from hidooch980/molidovpn-android.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hidooch980/molidovpn-android
          path: native
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: NDK and CMake
        run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Rust toolchain for the core
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/core/aether -> target
      - name: Prebuilt Psiphon, Tor and Xray from upstream MSN-GUARD
        working-directory: native
        run: |
          set -e
          base=https://github.com/mbm110/MSN-GUARD/raw/master/app
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/psiphontunnel-2.0.39.aar "$base/libs/psiphontunnel-2.0.39.aar"
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/$abi"
            for lib in libtor.so libobfs4proxy.so libxray.so; do
              curl -fL --retry 3 -o "app/src/main/jniLibs/$abi/$lib" "$base/src/main/jniLibs/$abi/$lib"
            done
          done
      - name: Build APKs
        working-directory: native
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          AETHERY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AETHERY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AETHERY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon             -PtargetAbi=arm64-v8a,armeabi-v7a             -PaetheryKeystore=release.keystore             -PmolidoVersionCode=$((20000 + ${{ github.run_number }}))             -PmolidoVersionName=$VERSION
          mkdir -p ../dist
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *arm64-v8a*)   cp "$f" ../dist/MobinVPN-android-arm64.apk ;;
              *armeabi-v7a*) cp "$f" ../dist/MobinVPN-android-armv7.apk ;;
              *universal*)   cp "$f" ../dist/MobinVPN-android-universal.apk ;;
            esac
          done
          ls -la ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: flutter build windows --release --build-name $env:VERSION --build-number ${{ github.run_number }}
      - name: Bundle sing-box (latest 1.12.x)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list -R SagerNet/sing-box --exclude-pre-releases --limit 100 --json tagName \
                --jq '[.[].tagName | select(startswith("v1.12."))][0]')
          VER=${TAG#v}
          gh release download "$TAG" -R SagerNet/sing-box -p "sing-box-${VER}-windows-amd64.zip" -O sb.zip
          unzip -q sb.zip
          cp "sing-box-${VER}-windows-amd64/sing-box.exe" build/windows/x64/runner/Release/
      - name: Validate the config shapes the app generates (TUN, fragment, DNS)
        shell: bash
        run: |
          cat > app-config-test.json <<'JSON'
          {
            "log": {"level": "warn"},
            "dns": {"servers": [{"type": "local", "tag": "local"},
                                {"type": "https", "tag": "remote", "server": "1.1.1.1", "detour": "proxy"}],
                    "final": "remote", "strategy": "prefer_ipv4"},
            "inbounds": [
              {"type": "mixed", "tag": "in", "listen": "127.0.0.1", "listen_port": 10808},
              {"type": "tun", "tag": "tun", "interface_name": "MobinVPN",
               "address": ["172.19.0.1/30", "fdfe:dcba:9876::1/126"], "auto_route": true, "strict_route": true, "stack": "mixed"}
            ],
            "outbounds": [
              {"type": "vless", "tag": "proxy", "server": "example.com", "server_port": 443,
               "uuid": "11111111-1111-1111-1111-111111111111", "packet_encoding": "xudp",
               "tls": {"enabled": true, "server_name": "example.com", "record_fragment": true,
                       "utls": {"enabled": true, "fingerprint": "chrome"}},
               "transport": {"type": "ws", "path": "/"}},
              {"type": "direct", "tag": "direct"}
            ],
            "route": {"rules": [{"action": "sniff"}, {"protocol": "dns", "action": "hijack-dns"},
                                {"ip_is_private": true, "outbound": "direct"},
                                {"domain_suffix": ["ir"], "outbound": "direct"}],
                      "final": "proxy", "auto_detect_interface": true, "default_domain_resolver": "local"},
            "experimental": {"clash_api": {"external_controller": "127.0.0.1:9090"}}
          }
          JSON
          build/windows/x64/runner/Release/sing-box.exe check -c app-config-test.json
      - name: Zip
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/MobinVPN-windows-x64.zip
      - name: Windows installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $iss = @"
          [Setup]
          AppId={{8F3C2A1E-6B4D-4F7A-9C1E-2D5B7A9E4C10}
          AppName=MolidoVPN
          AppVersion=$env:VERSION
          AppPublisher=MolidoVPN
          DefaultDirName={localappdata}\Programs\MolidoVPN
          PrivilegesRequired=lowest
          DisableProgramGroupPage=yes
          OutputDir=dist
          OutputBaseFilename=MolidoVPN-windows-setup
          SetupIconFile=windows
unner
esourcespp_icon.ico
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          [Languages]
          Name: "en"; MessagesFile: "compiler:Default.isl"
          [Tasks]
          Name: "desktopicon"; Description: "Desktop shortcut"; Flags: checkedonce
          [Files]
          Source: "build\windowsd
unner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          [Icons]
          Name: "{autoprograms}\MolidoVPN"; Filename: "{app}\mobin_vpn.exe"
          Name: "{autodesktop}\MolidoVPN"; Filename: "{app}\mobin_vpn.exe"; Tasks: desktopicon
          [Run]
          Filename: "{app}\mobin_vpn.exe"; Description: "Start MolidoVPN"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path molido.iss -Value $iss -Encoding UTF8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" molido.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MolidoVPN ${{ env.VERSION }}
          make_latest: true
          files: dist/*
          body: |
            ## دانلود
            | دستگاه | فایل |
            |---|---|
            | اندروید (بیشتر گوشی‌ها) | `MobinVPN-android-arm64.apk` |
            | اندروید قدیمی | `MobinVPN-android-armv7.apk` |
            | اگر مطمئن نیستید | `MobinVPN-android-universal.apk` |
            | ویندوز ۱۰ و ۱۱ (نصب‌کننده) | `MolidoVPN-windows-setup.exe` |
            | ویندوز، نسخه‌ی بدون نصب | `MobinVPN-windows-x64.zip` ← از حالت فشرده خارج کنید و `mobin_vpn.exe` (MolidoVPN) را اجرا کنید |

            ## استفاده
            - دکمه‌ی بزرگ را بزنید. در حالت **هوشمند** برنامه سرورها را با اینترنت خودتان می‌سنجد و به سریع‌ترین وصل می‌شود.
            - کارت «موقعیت» برای انتخاب کشور، دکمه‌ی 🖧 برای همه‌ی سرورها و تست پینگ، دکمه‌ی ⚙ برای تنظیمات پیشرفته.
            - برنامه خودش نسخه‌ی جدید را پیدا و نصب می‌کند.
